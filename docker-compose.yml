# AI Service Desk Autopilot — full stack (backend + frontend)
#
# Prerequisites (one-time):
#   1. Copy .env.example → .env and fill in credentials (shared separately)
#   2. Put SSH keys in tb-hackathon-ssh/ (case1_key.pem … case5_key.pem)
#   3. Run supabase/hack_ai_bootstrap.sql in your Supabase SQL editor
#
# Start:  docker compose up --build
# Stop:   docker compose down

services:
  backend:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: true
    environment:
      # Always use container paths for SSH — ignore host paths in .env
      SSH_KEYS_DIR: /keys
      SSH_PRIVATE_KEY_PATH: ${SSH_PRIVATE_KEY_PATH:-/keys/case1_key.pem}
      SSH_USERNAME: ${SSH_USERNAME:-azureuser}
      MOCK_MODE: ${MOCK_MODE:-false}
      # Always Gemini for proposals — do not override via .env
      LLM_PRIMARY: gemini
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      GEMINI_THINKING_MODEL: ${GEMINI_THINKING_MODEL:-gemini-3.5-flash}
      GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-high}
      GEMINI_TICKET_THINKING_ENABLED: ${GEMINI_TICKET_THINKING_ENABLED:-true}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./keys:/keys:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    env_file:
      - path: .env
        required: true
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
